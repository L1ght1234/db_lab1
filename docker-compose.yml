services:
  postgres:
    image: postgres:16-alpine
    container_name: sports_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro

volumes:
  pgdata: